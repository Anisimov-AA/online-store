# Server configuration
server.port=8080

# Logging configuration
logging.level.com.onlinestore.product=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Application info
spring.application.name=product-service
# share of POST /product answered with 503 (0 = good copy, 0.5 = bad copy)
product.failure-rate=${FAILURE_RATE:0}
